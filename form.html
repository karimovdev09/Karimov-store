<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="http://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <div class="container">
        <div class="box mt-6">
            <div class="filed">
              <label for="ism" class="label">Ismingiz</label>
              <div class="control">
                <input type="text" class="input" placeholder="Ism">
              </div>  
            </div>

            <div class="filed mt-4">
                <label for="familiya" class="label">Familiyangiz</label>
                <div class="control">
                    <input type="text" class="input" placeholder="Familiya">
                </div>
            </div>

            <div class="filed mt-4">
                <label for="tel" class="label">Raqamingiz</label>
                <div class="control">
                    <input type="tel" class="input" placeholder="+998 ** *** ** **">
                </div>
            </div>

            <div class="filed mt-4">
                <label for="Email" class="label ">Email</label>
                <div class="control">
                    <input type="email" name="email" id="Email" placeholder="@gmail.com" class="input">
                </div>
            </div>

            <div class="filed mt-4">
                <label for="textarea" class="label">Magazinimiz haqida fikringiz</label>
                <textarea name="textarea" id="textarea" placeholder="Magazinimiz haqida fikringizni qoldirip keting" class="textarea"></textarea>
            </div>

            <div class="filed mt-3">
                <input type="checkbox" name="checkbox" id="checkbox">
                <label for="checkbox" class="checkbox">Magazin menga yoqdi</label>
            </div>

            <div class="filed mt-1">
                <button class="button is-fullwidth  is-success">Yuborish</button>
            </div>
        </div>
    </div>
</body>
</html>
