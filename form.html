<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <div class="container">
        <div class="box mt-6">
            <!-- Formspree endpoint -->
            <form id="myForm" action="https://formspree.io/f/xwlezdyg" method="POST">
                <div class="field">
                    <label for="ism" class="label">Ismingiz</label>
                    <div class="control">
                        <input type="text" class="input" placeholder="Ism" name="ism" id="ism" required>
                    </div>  
                </div>

                <div class="field mt-4">
                    <label for="familiya" class="label">Familiyangiz</label>
                    <div class="control">
                        <input type="text" class="input" placeholder="Familiya" name="familiya" id="familiya" required>
                    </div>
                </div>

                <div class="field mt-4">
                    <label for="tel" class="label">Raqamingiz</label>
                    <div class="control">
                        <input type="tel" class="input" placeholder="+998 ** *** ** **" name="tel" id="tel" required>
                    </div>
                </div>

                <div class="field mt-4">
                    <label for="Email" class="label">Email</label>
                    <div class="control">
                        <input type="email" name="email" id="Email" placeholder="@gmail.com" class="input" required>
                    </div>
                </div>

                <div class="field mt-4">
                    <label for="textarea" class="label">Magazinimiz haqida fikringiz</label>
                    <textarea name="textarea" id="textarea" placeholder="Magazinimiz haqida fikringizni qoldirip keting" class="textarea"></textarea>
                </div>

                <div class="field mt-3">
                    <input type="checkbox" name="checkbox" id="checkbox">
                    <label for="checkbox" class="checkbox">Magazin menga yoqdi</label>
                </div>

                

                <div class="field mt-1">
                    <button type="submit" class="button is-fullwidth is-success">Yuborish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('myForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Formani odatiy yuborishni to'xtatish
            
            const form = this;
            const formData = new FormData(form);
            const messageDiv = document.getElementById('message');
            const submitButton = form.querySelector('button[type="submit"]');
            
            // Tugmani vaqtincha o'chirish
            submitButton.disabled = true;
            submitButton.textContent = 'Yuborilmoqda...';
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    
                    messageDiv.className = 'notification is-success mt-3';
                    messageDiv.textContent = '✅ Forma muvaffaqiyatli yuborildi!';
                    messageDiv.classList.remove('is-hidden');
                    
                    // Formani tozalash
                    form.reset();
                    
                    // 3 soniyadan so'ng xabarni yashirish
                    setTimeout(() => {
                        messageDiv.classList.add('is-hidden');
                    }, 3000);
                } else {
                    throw new Error('Xatolik yuz berdi');
                }
            } catch (error) {
                // Xatolik yuz berdi
                messageDiv.className = 'notification is-danger mt-3';
                messageDiv.textContent = '❌ Xatolik yuz berdi. Iltimos qaytadan urinib ko\'ring.';
                messageDiv.classList.remove('is-hidden');
            } finally {
                // Tugmani qayta yoqish
                submitButton.disabled = false;
                submitButton.textContent = 'Yuborish';
            }
        });
    </script>
</body>
</html>
